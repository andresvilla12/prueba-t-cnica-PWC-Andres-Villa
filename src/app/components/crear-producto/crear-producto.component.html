
<div class="container mt-5">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
        <div class="card">
            <div class="card-body text-center">
                <span class="titulo"> {{ titulo | uppercase }}</span>
                <form class="mt-3" [formGroup]="productoForm" (ngSubmit)="agregarProducto()">
                    <div class="mb-3"> 
                        <input type="text" formControlName="producto"
                         class="form-control form-control-lg" placeholder="Id">
                         <div class="text-danger"
                            *ngIf="productoForm.get('producto')?.hasError('required') && productoForm.get('producto')?.touched">
                            <span>El Id <strong>es obligatorio</strong></span>
                         </div>
                      </div>
                      <div class="mb-3">
                        <input type="text" formControlName="categoría"
                         class="form-control form-control-lg" placeholder="Nombre">
                         <div class="text-danger"
                         *ngIf="productoForm.get('categoría')?.hasError('required') && productoForm.get('categoría')?.touched">
                         <span>El Nombre <strong>es obligatorio</strong></span>
                      </div>
                      </div>
                      <div class="mb-3">
                        <input type="text" formControlName="ubicación"
                         class="form-control form-control-lg" placeholder="Correo">
                         <div class="text-danger"
                         *ngIf="productoForm.get('ubicación')?.hasError('required') && productoForm.get('ubicación')?.touched">
                         <span>El correo <strong>es obligatorio</strong></span>
                      </div>
                      </div>
                      <div class="mb-3">
                        <input type="number" formControlName="precio"
                         class="form-control form-control-lg" placeholder="Teléfono">
                         <div class="text-danger"
                         *ngIf="productoForm.get('precio')?.hasError('required') && productoForm.get('precio')?.touched">
                         <span>El teléfono <strong>es obligatorio</strong></span>
                      </div>
                      </div>
                      <div class="mb-3">
                        <button class="btn btn-secondary btn-lg float-start"><a href="../editar-producto" class="btn btn-secondary btn-lg float-start">VOLVER</a></button>
                        <button type="submit" [disabled]="productoForm.invalid" class="btn-success btn-lg float-end">ACEPTAR</button>
                      </div>
                      
                </form>
            </div>
        </div>
    </div>
 </div>
</div>
